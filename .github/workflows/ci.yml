name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法检查（Python）
        run: python -m py_compile server.py smoke.py package.py

      - name: 启动服务并跑冒烟
        env:
          LABFLOW_DATA: ${{ runner.temp }}/data
          LABFLOW_HOST: 127.0.0.1
          LABFLOW_PORT: "43300"
        run: |
          python server.py > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:43300/api/boards > /dev/null; then break; fi
            sleep 1
          done
          python smoke.py http://127.0.0.1:43300
          cat server.log

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 语法检查（前端内联脚本）
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw new Error('no script');new Function(m[1]);console.log('client syntax OK')"

      - name: 打包产物可构建
        run: python package.py
