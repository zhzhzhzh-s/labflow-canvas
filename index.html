<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>实验画布 · 极简工作流</title>
    <style>
      :root {
        --paper: #f4f1e9;
        --card: #fffdf8;
        --ink: #23262b;
        --ink-soft: #4d4a42;
        --muted: #8a8270;
        --line: #e2dbca;
        --line-strong: #d2c9b4;
        --accent: #2f6f5e;
        --danger: #a8462b;
        --radius: 14px;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; font-family: var(--font); color: var(--ink); background: var(--paper);
        overflow: hidden; line-height: 1.6; -webkit-font-smoothing: antialiased;
      }
      [hidden] { display: none !important; }
      button, input, select { font: inherit; color: inherit; }

      /* 顶栏 */
      .topbar {
        position: relative; z-index: 40; display: flex; align-items: center; gap: 7px;
        height: 54px; padding: 0 14px; background: rgba(255, 253, 248, 0.94);
        border-bottom: 1px solid var(--line); backdrop-filter: blur(10px);
      }
      .brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 14px; white-space: nowrap; }
      .brand-mark { width: 20px; height: 20px; border-radius: 6px; background: var(--accent); position: relative; flex: none; }
      .brand-mark::after { content: ""; position: absolute; inset: 5px; border-left: 2px solid #fffdf8; border-bottom: 2px solid #fffdf8; }
      .brand small { font-size: 10.5px; color: var(--muted); font-weight: 500; }
      .board-title {
        margin-left: 8px; padding: 4px 8px; border-radius: 7px; font-size: 14px; font-weight: 650;
        outline: none; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text;
      }
      .board-title:hover { background: #f0ebde; }
      .board-title:focus { background: #fff; box-shadow: inset 0 0 0 1px var(--line-strong); }
      .board-title:empty::before { content: "给这条实验线起个名字"; color: #b3ab99; font-weight: 400; }
      .grow { flex: 1; }
      .save-state { font-size: 10.5px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
      .save-state.dirty { color: #9a7620; }
      .conn-state {
        font-size: 10.5px; color: var(--muted); padding: 3px 8px; border-radius: 999px;
        background: #f0ebde; white-space: nowrap;
      }
      .conn-state.online { background: #e4f1ea; color: #2f6f5e; }
      .presence { display: flex; align-items: center; }
      .avatar {
        width: 23px; height: 23px; border-radius: 50%; margin-left: -7px;
        border: 2px solid var(--paper); display: grid; place-items: center;
        font-size: 10px; font-weight: 700; color: #fff;
      }
      .avatar:first-child { margin-left: 0; }
      .me {
        display: flex; align-items: center; gap: 5px; background: #f7f3e7;
        border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px 2px 5px;
      }
      .me-dot {
        width: 15px; height: 15px; border-radius: 50%; padding: 0; cursor: pointer;
        border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12); background: #e0b23a;
      }
      .me input { width: 42px; border: 0; background: transparent; font-size: 11.5px; outline: none; color: var(--ink-soft); }
      .btn {
        height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-strong);
        background: #fbf8ef; color: var(--ink-soft); font-size: 12.5px; cursor: pointer; white-space: nowrap;
      }
      .btn:hover { background: #f1ead9; }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn.primary:hover { background: #275f50; }
      .btn.active { background: var(--accent-soft); border-color: #b9d6c9; color: var(--accent); }
      .menu { position: relative; }
      .menu-pop {
        position: absolute; right: 0; top: calc(100% + 6px); min-width: 176px;
        background: var(--card); border: 1px solid var(--line); border-radius: 10px;
        box-shadow: 0 18px 40px -22px rgba(50, 40, 20, 0.55); padding: 5px; display: none; z-index: 50;
      }
      .menu:hover .menu-pop, .menu:focus-within .menu-pop { display: block; }
      .menu-pop button {
        display: block; width: 100%; text-align: left; border: 0; background: transparent;
        padding: 7px 9px; border-radius: 7px; font-size: 12.5px; cursor: pointer; color: var(--ink-soft);
      }
      .menu-pop button:hover { background: #f3eee1; }
      .menu-pop small { display: block; color: var(--muted); font-size: 10.5px; }
      .board-pop {
        position: absolute; left: 0; top: calc(100% + 6px); z-index: 60; width: 230px;
        background: #fffdf8; border: 1px solid var(--line-strong); border-radius: 12px;
        box-shadow: 0 20px 44px -24px rgba(40, 30, 15, 0.6); padding: 6px;
      }
      .board-list { max-height: 300px; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
      .board-item {
        display: flex; align-items: center; gap: 8px; border: 0; background: transparent;
        text-align: left; padding: 7px 8px; border-radius: 7px; font-size: 12.5px;
        color: var(--ink-soft); cursor: pointer; width: 100%;
      }
      .board-item:hover { background: #f3eee1; }
      .board-item.current { background: #e4f1ea; color: var(--accent); font-weight: 600; }
      .board-item .b-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .board-item .b-count { font-size: 10px; color: var(--muted); }
      .new-board {
        width: 100%; margin-top: 5px; border: 1px dashed var(--line-strong); background: transparent;
        border-radius: 7px; padding: 7px; font-size: 12px; color: var(--accent); cursor: pointer;
      }
      .new-board:hover { background: #f3f8f5; }

      /* 布局 */
      .app { display: flex; height: calc(100% - 54px); }
      .palette {
        position: relative; z-index: 20; width: 102px; flex: none; padding: 13px 9px;
        background: rgba(255, 253, 248, 0.9); border-right: 1px solid var(--line);
        display: flex; flex-direction: column; gap: 7px;
      }
      .palette-title { font-size: 10px; letter-spacing: 0.1em; color: var(--muted); padding: 0 3px 1px; margin-top: 3px; }
      .pblock {
        display: flex; align-items: center; gap: 7px; width: 100%; padding: 8px 9px;
        border-radius: 9px; border: 1px solid var(--line); background: #fbf8ef;
        font-size: 12px; color: var(--ink-soft); cursor: grab; user-select: none; text-align: left;
      }
      .pblock-main { border-color: #cfc6b2; background: #f6efdd; font-weight: 600; }
      .pblock .pdot { width: 11px; height: 11px; border-radius: 3px; flex: none; background: #e0b23a; }
      .pmark {
        border: 1px dashed #d8cdb6; background: #fbf8ef; border-radius: 999px;
        padding: 4px 8px; font-size: 11px; cursor: grab; user-select: none; text-align: center;
      }
      .pmark[data-tone="urgent"] { color: #b23a30; border-color: #e6b9b2; background: #fdf0ee; }
      .pmark[data-tone="todo"] { color: #8a6410; border-color: #e6d29a; background: #fbf4df; }
      .pmark[data-tone="done"] { color: #2b6b4d; border-color: #b9d9c6; background: #eaf5ee; }
      .pmark[data-tone="key"] { color: #6a4fae; border-color: #cbbfe8; background: #f1edfa; }
      .palette-hint { margin-top: auto; font-size: 10.5px; color: var(--muted); line-height: 1.7; padding: 0 2px; }

      #stage {
        position: relative; flex: 1; overflow: hidden; touch-action: none;
        background-color: var(--paper);
        background-image: radial-gradient(circle, #dcd4c1 1px, transparent 1px);
        background-size: var(--gs, 26px) var(--gs, 26px);
        background-position: var(--gx, 0) var(--gy, 0);
      }
      #stage.panning { cursor: grabbing; }
      #stage.selecting { cursor: crosshair; }
      #world { position: absolute; inset: 0; transform-origin: 0 0; }
      #bands, #nodes, #stickers, #labels, #guides { position: absolute; inset: 0; pointer-events: none; }
      #bands .band {
        position: absolute; width: 360px; border-radius: 18px;
        background: rgba(255, 253, 248, 0.58); border: 1px dashed #e3dbc9;
      }
      #bands .band:nth-child(even) { background: rgba(250, 246, 236, 0.82); }
      #bands .band-label {
        position: absolute; top: -40px; left: 2px; font-size: 14px; letter-spacing: 0.02em;
        color: #5f5744; font-weight: 650; white-space: nowrap;
      }
      #edgeLayer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
      #edgePaths path {
        fill: none; stroke: #a99f8a; stroke-width: 1.6; marker-end: url(#arrow);
        pointer-events: stroke; cursor: pointer;
      }
      #edgePaths path:hover, #edgePaths path.selected { stroke: #2f6f5e; stroke-width: 2.4; }
      #stickers { z-index: 30; }
      #guides { z-index: 28; }
      #guides .guide { position: absolute; background: #2f6f5e; opacity: 0; }
      #guides .guide.v { top: 0; bottom: 0; width: 1px; }
      #guides .guide.h { left: 0; right: 0; height: 1px; }
      #guides.on .guide { opacity: 0.5; }
      #rubber {
        position: absolute; z-index: 26; pointer-events: none; border-radius: 3px;
        border: 1.5px dashed #2f6f5e; background: rgba(47, 111, 94, 0.1);
      }
      #stage.panning #rubber { display: none !important; }

      /* 节点 */
      .node {
        position: absolute; width: 320px; background: var(--card);
        border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: 0 1px 2px rgba(60, 50, 30, 0.06), 0 14px 30px -26px rgba(60, 50, 30, 0.6);
        display: flex; flex-direction: column; pointer-events: auto;
      }
      .node::before {
        content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 5px;
        border-radius: 0 5px 5px 0; background: var(--owner);
      }
      .node.selected { outline: 2px solid var(--accent); outline-offset: 3px; }
      .node.dragging { z-index: 6; box-shadow: 0 22px 50px -24px rgba(40, 34, 20, 0.65); }
      .node.drag-over { outline: 2px dashed var(--accent); outline-offset: 4px; }
      .node-head {
        display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 11px;
        background: var(--owner-soft); border-radius: 13px 13px 0 0; cursor: grab; user-select: none;
      }
      .node-head:active { cursor: grabbing; }
      .color-btn {
        width: 16px; height: 16px; flex: none; border-radius: 50%; padding: 0;
        background: var(--owner); border: 2px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.14); cursor: pointer;
      }
      .color-btn:hover { transform: scale(1.15); }
      .grip { color: var(--owner-ink); opacity: 0.4; font-size: 12px; letter-spacing: 1px; }
      .who {
        width: 46px; border: 0; background: transparent; color: var(--owner-ink);
        font-size: 11.5px; font-weight: 700; padding: 0 2px; border-radius: 4px; outline: none;
      }
      .who:focus { background: #fff; }
      .who::placeholder { color: var(--owner-ink); opacity: 0.45; font-weight: 400; }
      input.date {
        border: 0; background: transparent; font-size: 10.5px; color: #7a7263;
        font-family: var(--mono); width: 104px; outline: none; padding: 0; cursor: pointer;
      }
      input.date::-webkit-calendar-picker-indicator { opacity: 0.45; cursor: pointer; }
      .head-grow { flex: 1; }
      .del {
        border: 0; background: transparent; color: var(--owner-ink); opacity: 0.5; cursor: pointer;
        font-size: 15px; line-height: 1; padding: 1px 4px; border-radius: 6px;
      }
      .del:hover { opacity: 1; color: var(--danger); background: rgba(255, 255, 255, 0.6); }

      .node-body { padding: 9px 15px 11px; display: flex; flex-direction: column; gap: 5px; }
      .title {        font-size: 15px; font-weight: 650; line-height: 1.45; outline: none;
        border-radius: 6px; padding: 1px 5px; margin-left: -5px; min-height: 24px;
      }
      .title:empty::before { content: attr(data-ph); color: #b3ab99; font-weight: 400; }
      .title:focus { background: #fffef9; box-shadow: inset 0 0 0 1px #e8e2d2; }
      .body {
        font-size: 12.5px; line-height: 1.7; color: var(--ink-soft); outline: none;
        border-radius: 6px; padding: 1px 5px; margin-left: -5px; white-space: pre-wrap; min-height: 20px;
      }
      .body:empty::before { content: attr(data-ph); color: #b9b09c; }
      .body:focus { background: #fffef9; box-shadow: inset 0 0 0 1px #e8e2d2; }
      .result { display: flex; gap: 6px; align-items: flex-start; }
      .rlabel { flex: none; font-size: 10px; letter-spacing: 0.08em; color: var(--muted); padding-top: 4px; }
      .rtext {
        flex: 1; min-width: 0; font-size: 12px; line-height: 1.65; color: var(--ink-soft);
        background: #faf7ee; border: 1px solid #eee7d6; border-radius: 8px;
        padding: 2px 8px; outline: none; white-space: pre-wrap; min-height: 24px;
      }
      .rtext:empty::before { content: attr(data-ph); color: #b9b09c; }
      .rtext:focus { background: #fff; border-color: #cfc6b2; }

      .files { display: flex; flex-wrap: wrap; gap: 5px; }
      .file-chip {
        display: inline-flex; align-items: center; gap: 5px; max-width: 100%;
        background: #f3eedf; border: 1px solid #e6ddc8; border-radius: 999px;
        padding: 2px 3px 2px 8px; font-size: 11px; color: var(--ink-soft); cursor: pointer;
      }
      .file-chip:hover { background: #ece4d1; }
      .file-ext { font-size: 8.5px; font-weight: 700; color: #7d5218; background: #e9dfc6; border-radius: 3px; padding: 1px 3px; }
      .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
      .file-size { color: var(--muted); font-size: 9.5px; font-family: var(--mono); }
      .file-x { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; line-height: 1; padding: 0 2px; border-radius: 999px; }
      .file-x:hover { color: var(--danger); background: #f7e6e0; }
      .add-file {
        align-self: flex-start; border: 1px dashed var(--line-strong); background: transparent;
        color: var(--muted); border-radius: 999px; padding: 1px 9px; font-size: 10.5px; cursor: pointer;
      }
      .add-file:hover { color: var(--accent); border-color: var(--accent); }

      .port {
        position: absolute; right: -8px; top: 46px; width: 15px; height: 15px; border-radius: 50%;
        background: #fff; border: 2px solid var(--owner); opacity: 0.55; cursor: crosshair; z-index: 6;
        transition: transform 120ms ease, opacity 120ms ease;
      }
      .node:hover .port { opacity: 1; }
      .port:hover { transform: scale(1.25); }
      .drop-hint {
        position: absolute; inset: 0; border-radius: var(--radius); border: 2px dashed var(--accent);
        background: rgba(47, 111, 94, 0.06); display: none; align-items: center; justify-content: center;
        font-size: 12px; color: var(--accent); font-weight: 600; pointer-events: none;
      }
      .node.drag-over .drop-hint { display: flex; }

      /* 标记 */
      .sticker {
        position: absolute; transform: rotate(-7deg); transform-origin: center;
        display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px 5px 12px;
        border-radius: 9px; border: 2px solid var(--tone); background: #fffdf8;
        color: var(--tone); font-size: var(--st-size, 15px); font-weight: 700; letter-spacing: 0.05em;
        box-shadow: 0 4px 12px -4px rgba(0, 0, 0, 0.4); pointer-events: auto; cursor: grab;
        user-select: none; white-space: nowrap;
      }
      .sticker::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--tone); flex: none; }
      .sticker:active { cursor: grabbing; }
      .sticker.dragging { opacity: 0.6; }
      .sticker-x {
        border: 0; background: transparent; color: inherit; opacity: 0.3; cursor: pointer;
        font-size: 17px; line-height: 18px; width: 20px; height: 20px; padding: 0; margin-left: 2px;
        border-radius: 50%; flex: none; text-align: center;
      }
      .sticker-x:hover { opacity: 1; background: rgba(0, 0, 0, 0.07); }
      .sticker.selected { outline: 2px solid var(--accent); outline-offset: 3px; }

      /* 连线标签 */
      .edge-label {
        position: absolute; transform: translate(-50%, -50%); max-width: 150px;
        padding: 1px 8px; border-radius: 999px; background: rgba(255, 253, 248, 0.96);
        border: 1px solid var(--line); color: var(--ink-soft); font-size: 10.5px; line-height: 1.5;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: auto;
        cursor: text; box-shadow: 0 1px 3px rgba(60, 50, 30, 0.08);
      }
      .edge-label:hover { border-color: var(--accent); color: var(--accent); }
      .edge-label.empty { opacity: 0; }
      #labels:hover .edge-label.empty { opacity: 0.9; }
      .edge-label-input {
        position: absolute; transform: translate(-50%, -50%); width: 200px; padding: 2px 8px;
        border-radius: 999px; border: 1px solid var(--accent); font-size: 11px; text-align: center;
        outline: none; pointer-events: auto; background: #fff; z-index: 20; font-family: var(--font);
      }
      .edge-temp { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; marker-end: url(#arrow); }

      /* 浮层 */
      .hint {
        position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 25;
        display: flex; align-items: center; gap: 10px; max-width: min(92vw, 700px);
        background: rgba(35, 38, 43, 0.82); color: #f4efe2; font-size: 11.5px;
        padding: 7px 9px 7px 13px; border-radius: 999px; backdrop-filter: blur(6px);
      }
      .hint button { border: 0; background: transparent; color: inherit; opacity: 0.6; cursor: pointer; font-size: 14px; line-height: 1; }
      .zoombar {
        position: absolute; right: 14px; bottom: 14px; z-index: 25; display: flex; align-items: center; gap: 2px;
        background: rgba(255, 253, 248, 0.94); border: 1px solid var(--line); border-radius: 999px;
        padding: 2px 5px; font-size: 10.5px; color: var(--muted); backdrop-filter: blur(6px);
      }
      .zoombar button { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1; padding: 2px 5px; border-radius: 6px; }
      .zoombar button:hover { background: #efe9da; color: var(--ink); }
      .zoombar span { min-width: 38px; text-align: center; font-family: var(--mono); font-size: 10px; }

      .ghost {
        position: fixed; z-index: 80; pointer-events: none; width: 150px; padding: 7px 10px;
        border-radius: 9px; background: var(--card); border: 1px solid var(--line-strong);
        box-shadow: 0 16px 30px -18px rgba(0, 0, 0, 0.5); font-size: 12px; color: var(--ink-soft);
        display: flex; align-items: center; gap: 7px; opacity: 0.95;
      }
      .ghost .pdot { width: 10px; height: 10px; border-radius: 3px; }

      .sticker-pop {
        position: fixed; z-index: 95; width: 206px; padding: 9px 10px;
        background: #fffdf8; border: 1px solid var(--line-strong); border-radius: 10px;
        box-shadow: 0 18px 40px -22px rgba(40, 30, 15, 0.55);
        display: flex; flex-direction: column; gap: 6px; font-size: 11px; color: var(--muted);
      }
      .sticker-pop label { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .sticker-pop input[type="text"] { width: 112px; height: 24px; border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 0 6px; font-size: 11.5px; outline: none; }
      .sticker-pop input[type="color"] { width: 42px; height: 24px; border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 1px; cursor: pointer; }
      .sticker-pop input[type="range"] { width: 112px; }
      .sticker-actions { display: flex; gap: 6px; margin-top: 2px; }
      .sticker-actions button { flex: 1; height: 25px; border: 1px solid var(--line); border-radius: 6px; background: #fbf8ef; font-size: 11.5px; cursor: pointer; }
      .sticker-actions button:hover { background: #f1ead9; }

      .toast {
        position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 70;
        display: flex; align-items: center; gap: 12px; background: rgba(35, 38, 43, 0.94);
        color: #f5f0e3; padding: 8px 13px; border-radius: 999px; font-size: 12px;
        box-shadow: 0 16px 40px -18px rgba(0, 0, 0, 0.6); max-width: min(92vw, 560px);
      }
      .toast button { border: 0; background: transparent; color: #ffd9a8; cursor: pointer; font-size: 12px; text-decoration: underline; white-space: nowrap; padding: 0; }
      .toast.error { background: #8c3f22; }

      .empty { position: absolute; inset: 0; z-index: 15; display: grid; place-items: center; pointer-events: none; }
      .empty-card {
        pointer-events: auto; text-align: center; padding: 26px 30px; border-radius: 18px;
        background: rgba(255, 253, 248, 0.92); border: 1px dashed var(--line-strong);
        box-shadow: 0 18px 40px -30px rgba(60, 50, 30, 0.5);
      }
      .empty-card h2 { margin: 0 0 6px; font-size: 17px; }
      .empty-card p { margin: 0 0 14px; font-size: 12px; color: var(--muted); line-height: 1.8; }
      .empty-card .row { display: flex; gap: 8px; justify-content: center; }

      /* 颜色面板 */
      .color-pop {
        position: fixed; z-index: 90; width: 208px; padding: 10px;
        background: #fffdf8; border: 1px solid var(--line-strong); border-radius: 12px;
        box-shadow: 0 20px 44px -24px rgba(40, 30, 15, 0.6);
      }
      .color-pop .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
      .color-pop .swatch {
        width: 100%; aspect-ratio: 1; border-radius: 50%; border: 2px solid #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12); cursor: pointer; padding: 0;
      }
      .color-pop .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
      .color-pop .custom-row { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; font-size: 11.5px; color: var(--muted); }
      .color-pop input[type="color"] { width: 42px; height: 26px; border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 1px; cursor: pointer; }
      .color-pop .reset { margin-top: 8px; width: 100%; border: 1px solid var(--line); background: #fbf8ef; border-radius: 7px; font-size: 11.5px; color: var(--ink-soft); padding: 4px; cursor: pointer; }

      /* 列设置 */
      .col-pop {
        position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; width: 248px;
        background: #fffdf8; border: 1px solid var(--line-strong); border-radius: 12px;
        box-shadow: 0 20px 44px -24px rgba(40, 30, 15, 0.6); padding: 11px;
        display: flex; flex-direction: column; gap: 8px;
      }
      .col-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--ink-soft); }
      .col-row input { height: 26px; border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 0 6px; font-size: 11.5px; outline: none; }
      .col-row input[type="number"] { width: 64px; }
      .seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
      .seg button { border: 0; background: #fbf8ef; padding: 4px 9px; font-size: 11.5px; cursor: pointer; color: var(--muted); }
      .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
      .col-note { margin: 2px 0 0; font-size: 10.5px; color: var(--muted); line-height: 1.6; }
      .col-actions { display: flex; gap: 6px; }
      .col-actions .btn { flex: 1; height: 26px; font-size: 11.5px; }

      @media (max-width: 760px) {
        .topbar { height: auto; flex-wrap: wrap; padding: 7px 10px; gap: 5px; }
        .board-title { max-width: 50vw; font-size: 13px; }
        .save-state { display: none; }
        .app { flex-direction: column; height: calc(100% - 96px); }
        .palette { width: 100%; flex-direction: row; overflow-x: auto; padding: 8px 10px; border-right: 0; border-bottom: 1px solid var(--line); }
        .palette-title, .palette-hint { display: none; }
        .pblock { width: auto; white-space: nowrap; }
        .pmark { white-space: nowrap; }
        #stage { min-height: 0; }
        .hint { font-size: 10.5px; bottom: 52px; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>实验画布</span>
        <small>极简工作流</small>
      </div>
      <div class="menu">
        <button id="btnBoards" class="btn" type="button">画布 ▾</button>
        <div id="boardPop" class="board-pop" hidden>
          <div id="boardList" class="board-list"></div>
          <button id="btnNewBoard" class="new-board" type="button">＋ 新建画布</button>
        </div>
      </div>
      <div id="boardTitle" class="board-title" contenteditable="true" spellcheck="false"></div>
      <span class="grow"></span>
      <span id="saveState" class="save-state">已保存</span>
      <span id="connState" class="conn-state">本地模式</span>
      <div id="presence" class="presence" title="现在在线的人"></div>
      <label class="me" title="你的名字和颜色，别人会看到">
        <button id="meDot" class="me-dot" type="button" title="换我的颜色"></button>
        <input id="meName" maxlength="12" spellcheck="false" />

      <button id="btnLayout" class="btn" type="button" aria-pressed="false" title="点一下按日期排进列里，再点一下恢复原来的位置">按时间排列</button>
      <button id="btnAlign" class="btn" type="button" title="把每块吸到最近的列和行">对齐</button>
      <div class="menu">
        <button id="btnCols" class="btn" type="button" aria-expanded="false">列设置</button>
        <div id="colPop" class="col-pop" hidden>
          <div class="col-row">
            <span>一列多长</span>
            <div class="seg" id="colUnit">
              <button type="button" data-unit="week">周</button>
              <button type="button" data-unit="day">日</button>
              <button type="button" data-unit="custom">自定义</button>
            </div>
          </div>
          <label class="col-row"><span>每列天数</span><input id="colDays" type="number" min="1" max="31" /></label>
          <label class="col-row"><span>起始日期</span><input id="colStart" type="date" /></label>
          <div class="col-actions">
            <button id="colEarliest" class="btn" type="button">用最早日期</button>
            <button id="colClose" class="btn" type="button">收起</button>

        </div>
      </div>
      <div class="menu">
        <button class="btn" type="button">导出</button>
        <div class="menu-pop">
          <button type="button" data-export="json">JSON 备份 <small>含附件，可再导回来</small></button>
          <button type="button" data-export="md">Markdown <small>按顺序写成文档给人看</small></button>
        </div>

      <button id="btnImport" class="btn" type="button">导入</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden />
    </header>

    <div class="app">
      <aside class="palette">
        <div class="palette-title">拖到画布</div>
        <button class="pblock pblock-main" id="pNew" type="button"><span class="pdot"></span>新块</button>
        <div class="palette-title">标记</div>
        <button class="pmark" type="button" data-tone="urgent">加急</button>
        <button class="pmark" type="button" data-tone="todo">待办</button>
        <button class="pmark" type="button" data-tone="done">已完成</button>
        <button class="pmark" type="button" data-tone="key">重点</button>
        <button class="pmark" type="button" data-tone="custom">自定义</button>

      </aside>

      <main id="stage">
        <div id="world">
          <div id="bands"></div>
          <svg id="edgeLayer" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#a99f8a" />

        <div id="rubber" hidden></div>

        <div id="empty" class="empty" hidden>
          <div class="empty-card">

            <div class="row">

        <div id="hint" class="hint" hidden>
          双击空白新建 · 空白拖动平移 · 空格+拖动画框选，Delete 批量删 · 按住顶部拖动块 · 右侧圆点拉线 · 文件拖到块上 · 左边可拖标记

    <div id="colorPop" class="color-pop" hidden>
      <div class="swatches" id="colorSwatches"></div>

      </div>

    <div id="toast" class="toast" hidden></div>

    <script>
      (() => {
        "use strict";

        const KEY = "labflow.canvas.v3";
        const DB_NAME = "labflow-demo";
        const DB_STORE = "files";
        const NODE_W = 320;
        const BAND_W = 560;
        const BAND_LEFT = 40;
        const TOP = 90;
        const ROW_H = 250;

        const CLIENT_ID = (() => {
          let id = localStorage.getItem("labflow.client");
          if (!id) {
            id = (window.crypto?.randomUUID?.() || String(Math.random())).slice(0, 18);
            localStorage.setItem("labflow.client", id);
          }
          return id;
        })();
        const ME = {
          name: localStorage.getItem("labflow.name") || "我",
          color: localStorage.getItem("labflow.color") || "#e0b23a",
        };

        const COLORS = ["#e0b23a", "#d97b29", "#c9524a", "#c46a92", "#8463c6", "#3f6fa8", "#2f8a86", "#4a8a52", "#7d7768"];
        const TONES = {
          urgent: { text: "加急", color: "#c8473d" },
          todo: { text: "待办", color: "#c98a1b" },
          done: { text: "已完成", color: "#3f8a5a" },
          key: { text: "重点", color: "#7b5cc6" },
          custom: { text: "自定义", color: "#8a6d3b" },
        };
        const KINDS = { experiment: "实验", summary: "总结", task: "分工", material: "资料" };

        const $ = (sel, root = document) => root.querySelector(sel);
        const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

        const stage = $("#stage");
        const world = $("#world");
        const bandsEl = $("#bands");
        const nodesEl = $("#nodes");
        const stickersEl = $("#stickers");
        const labelsEl = $("#labels");
        const edgePaths = $("#edgePaths");
        const zoomLabel = $("#zoomLabel");

        let model = null;
        let view = { x: 40, y: 90, zoom: 1 };
        const nodeEls = new Map();
        const stickerEls = new Map();
        const labelEls = new Map();
        const pathEls = new Map();
        let selectedNode = null;
        let selectedNodes = new Set();
        let selectedStickers = new Set();
        let spaceDown = false;
        let selectedEdge = null;
        let colorTarget = null;
        let saveTimer = null;
        let toastTimer = null;
        let edgeFrame = 0;
        let drag = null;
        let paletteDrag = null;
        let arrangeSnapshot = null;
        let dbPromise = null;
        const memFiles = new Map();
        let mode = "local";
        let serverRev = 0;
        let currentBoardId = localStorage.getItem("labflow.boardId") || "main";
        let boards = [];
        let sampleSeeded = false;
        const BOARDS_KEY = "labflow.boards";
        let pushTimer = null;
        let pushing = false;
        let sse = null;
        let refreshTimer = null;
        let refreshPending = false;
        let refreshBound = false;
        let onlinePeople = [];
        let changeSeq = 0;
        let pushedSeq = 0;
        let retryTimer = null;

        // ---------- 工具 ----------
        function uid() {
          if (window.crypto && crypto.randomUUID) return crypto.randomUUID().slice(0, 18);
          return "id" + Math.random().toString(36).slice(2, 12);
        }
        function escapeHtml(text) {
          return String(text ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
        }
        function formatSize(bytes) {
          const n = Number(bytes) || 0;
          if (n < 1024) return n + " B";
          if (n < 1024 * 1024) return Math.round(n / 1024) + " KB";
          return (n / 1024 / 1024).toFixed(1) + " MB";
        }
        function extOf(name) {
          const m = String(name || "").match(/\.([a-z0-9]{1,5})$/i);
          return m ? m[1].toUpperCase() : "FILE";
        }
        function today() {
          const d = new Date();
          const pad = (n) => String(n).padStart(2, "0");
          return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
        }
        function nowLabel() {
          const d = new Date();
          const pad = (n) => String(n).padStart(2, "0");
          return pad(d.getHours()) + ":" + pad(d.getMinutes());
        }
        function parseDate(value) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value || ""))) return null;
          const [y, m, d] = value.split("-").map(Number);
          const date = new Date(y, m - 1, d);
          return Number.isNaN(date.getTime()) ? null : date;
        }
        function mondayOf(date) {
          const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
          d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
          return d;
        }
        function fmtDate(date) {
          const pad = (n) => String(n).padStart(2, "0");
          return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
        }
        function shortDate(date) {
          const pad = (n) => String(n).padStart(2, "0");
          return pad(date.getMonth() + 1) + "/" + pad(date.getDate());
        }
        function weekdayName(date) {
          return "日一二三四五六"[date.getDay()];
        }

        // ---------- 颜色 ----------
        function normalizeHex(value, fallback) {
          const text = String(value || "").trim();
          return /^#[0-9a-f]{6}$/i.test(text) ? text.toLowerCase() : fallback;
        }
        function mixColor(hex, base, ratio) {
          const a = parseInt(hex.slice(1), 16);
          const b = parseInt(base.slice(1), 16);
          const r = Math.round(((a >> 16) & 255) * ratio + ((b >> 16) & 255) * (1 - ratio));
          const g = Math.round(((a >> 8) & 255) * ratio + ((b >> 8) & 255) * (1 - ratio));
          const bl = Math.round((a & 255) * ratio + (b & 255) * (1 - ratio));
          return "#" + [r, g, bl].map((n) => n.toString(16).padStart(2, "0")).join("");
        }
        function colorOf(node) {
          return normalizeHex(node.color, COLORS[0]);
        }
        function applyNodeColor(el, color) {
          const c = normalizeHex(color, COLORS[0]);
          el.style.setProperty("--owner", c);
          el.style.setProperty("--owner-soft", mixColor(c, "#fffdf8", 0.24));
          el.style.setProperty("--owner-ink", mixColor(c, "#23262b", 0.62));
        }

        // ---------- 列 ----------
        function defaultStart() {
          const configured = parseDate(model?.columns?.start);
          if (configured) return configured;
          const dates = model.nodes.map((n) => parseDate(n.date)).filter(Boolean).sort((a, b) => a - b);
          return dates.length ? mondayOf(dates[0]) : mondayOf(new Date());
        }
        function columnDays() {
          const cfg = model.columns;
          if (cfg.unit === "day") return 1;
          if (cfg.unit === "week") return 7;
          return Math.min(31, Math.max(1, Number(cfg.days) || 7));
        }
        function getColumns() {
          const days = columnDays();
          const start = defaultStart();
          const dates = model.nodes.map((n) => parseDate(n.date)).filter(Boolean).sort((a, b) => a - b);
          const last = dates.length ? dates[dates.length - 1] : start;
          const span = Math.max(0, Math.floor((last - start) / 86400000));
          const needed = Math.ceil((span + 1) / days);
          const minCols = model.columns.unit === "day" ? 10 : 4;
          const count = Math.min(60, Math.max(needed, minCols));
          const cols = [];
          for (let i = 0; i < count; i += 1) {
            const s = new Date(start);
            s.setDate(s.getDate() + i * days);
            const e = new Date(s);
            e.setDate(e.getDate() + days - 1);
            cols.push({ start: s, end: e });
          }
          return { cols, days };
        }
        function columnX(index) {
          return BAND_LEFT + index * BAND_W + 20;
        }
        function columnXs() {
          return getColumns().cols.map((_, i) => columnX(i));
        }

        // ---------- 存储 ----------
        function normalizeColumns(raw) {
          const cfg = raw && typeof raw === "object" ? raw : {};
          const unit = ["week", "day", "custom"].includes(cfg.unit) ? cfg.unit : "week";
          const fallback = unit === "day" ? 1 : 7;
          const days = Math.min(31, Math.max(1, Number(cfg.days) || fallback));
          return {
            unit,
            days: unit === "week" ? 7 : unit === "day" ? 1 : days,
            start: /^\d{4}-\d{2}-\d{2}$/.test(String(cfg.start || "")) ? cfg.start : "",
          };
        }
        function normalizeNode(raw, index) {
          const ownerMap = { me: "我", shixiong: "师兄", shidi: "师弟", other: "其他" };
          return {
            id: raw.id || uid(),
            x: Number.isFinite(Number(raw.x)) ? Number(raw.x) : columnX(0),
            y: Number.isFinite(Number(raw.y)) ? Number(raw.y) : TOP + index * 30,
            owner: ownerMap[String(raw.owner || "")] || String(raw.owner ?? "").slice(0, 12) || "我",
            color: normalizeHex(raw.color, COLORS[index % COLORS.length]),
            kind: KINDS[raw.kind] ? raw.kind : "experiment",
            date: /^\d{4}-\d{2}-\d{2}$/.test(String(raw.date || "")) ? raw.date : "",
            title: String(raw.title ?? ""),
            body: String(raw.body ?? ""),
            result: String(raw.result ?? ""),
            updatedAt: String(raw.updatedAt || new Date().toISOString()),
            files: Array.isArray(raw.files)
              ? raw.files.map((f) => ({ id: f.id || uid(), name: String(f.name ?? "文件"), type: String(f.type ?? ""), size: Number(f.size) || 0 }))
              : [],
          };
        }
        function normalizeModel(data) {
          const nodes = (data.nodes || []).map(normalizeNode);
          const ids = new Set(nodes.map((n) => n.id));
          const edges = (data.edges || [])
            .filter((e) => e && ids.has(e.from) && ids.has(e.to) && e.from !== e.to)
            .map((e) => ({ id: e.id || uid(), from: e.from, to: e.to, label: String(e.label ?? ""), updatedAt: String(e.updatedAt || new Date().toISOString()) }));
          const stickers = (Array.isArray(data.stickers) ? data.stickers : [])
            .filter((s) => s && TONES[s.tone] && (!s.nodeId || ids.has(s.nodeId)))
            .map((s) => ({
              id: s.id || uid(),
              tone: s.tone,
              text: String(s.text ?? TONES[s.tone].text).slice(0, 10),
              color: normalizeHex(s.color, TONES[s.tone].color),
              nodeId: s.nodeId && ids.has(s.nodeId) ? s.nodeId : null,
              x: Number.isFinite(Number(s.x)) ? Number(s.x) : 0,
              y: Number.isFinite(Number(s.y)) ? Number(s.y) : 0,
              size: Math.min(34, Math.max(11, Number(s.size) || 15)),
              updatedAt: String(s.updatedAt || new Date().toISOString()),
            }));
          const deleted = { nodes: {}, edges: {}, stickers: {} };
          for (const kind of ["nodes", "edges", "stickers"]) {
            const raw = data.deleted && typeof data.deleted[kind] === "object" ? data.deleted[kind] : {};
            for (const [id, at] of Object.entries(raw)) {
              if (typeof at === "string") deleted[kind][id] = at;
            }
          }
          return {
            v: 4,
            title: String(data.title ?? "实验画布"),
            nodes,
            edges,
            stickers,
            columns: normalizeColumns(data.columns),
            boardUpdatedAt: String(data.boardUpdatedAt || ""),
            deleted,
            view: data.view && Number.isFinite(Number(data.view.zoom)) ? data.view : null,
          };
        }
        function nowIso() {
          return new Date().toISOString();
        }
        function touch(item) {
          if (item) item.updatedAt = nowIso();
        }
        function newer(a, b) {
          return String(a || "") > String(b || "");
        }
        function mergeBoard(local, incoming) {
          const out = local;
          out.nodes = out.nodes || [];
          out.edges = out.edges || [];
          out.stickers = out.stickers || [];
          out.deleted = out.deleted || { nodes: {}, edges: {}, stickers: {} };
          for (const kind of ["nodes", "edges", "stickers"]) {
            const byId = new Map((out[kind] || []).map((item) => [item.id, item]));
            const tomb = { ...(out.deleted[kind] || {}) };
            const incTomb = (incoming && incoming.deleted && incoming.deleted[kind]) || {};
            for (const [id, at] of Object.entries(incTomb)) {
              if (newer(at, tomb[id])) tomb[id] = at;
            }
            for (const item of (incoming && incoming[kind]) || []) {
              const old = byId.get(item.id);
              if (old) {
                if (newer(item.updatedAt, old.updatedAt)) Object.assign(old, item);
              } else if (!tomb[item.id] || newer(item.updatedAt, tomb[item.id])) {
                byId.set(item.id, item);
              }
            }
            for (const [id, at] of Object.entries({ ...tomb })) {
              const item = byId.get(id);
              if (item && !newer(item.updatedAt, at)) byId.delete(id);
              else if (item) delete tomb[id];
            }
            out[kind] = [...byId.values()];
            out.deleted[kind] = tomb;
          }
          if (newer(incoming && incoming.boardUpdatedAt, out.boardUpdatedAt)) {
            out.title = incoming.title ?? out.title;
            out.columns = incoming.columns ?? out.columns;
            out.boardUpdatedAt = incoming.boardUpdatedAt;
          }
          return out;
        }

        function loadModel(id = currentBoardId) {
          try {
            const key = KEY + "." + id;
            let raw = localStorage.getItem(key);
            if (!raw && id === "main") raw = localStorage.getItem(KEY);
            if (!raw) return null;
            const data = JSON.parse(raw);
            if (!data || !Array.isArray(data.nodes)) return null;
            return normalizeModel(data);
          } catch {
            return null;
          }
        }
        function localBoards() {
          try {
            const list = JSON.parse(localStorage.getItem(BOARDS_KEY) || "[]");
            return Array.isArray(list) ? list : [];
          } catch {
            return [];
          }
        }
        function saveLocalBoards(list) {
          localStorage.setItem(BOARDS_KEY, JSON.stringify(list));
        }
        function emptyModel(title = "未命名画布") {
          return normalizeModel({ title, nodes: [], edges: [], stickers: [], columns: { unit: "week", days: 7, start: "" } });
        }
        function persistNow() {
          try {
            model.view = { ...view };
            localStorage.setItem(KEY + "." + currentBoardId, JSON.stringify(model));
            localStorage.setItem("labflow.view." + currentBoardId, JSON.stringify(view));
            if (mode === "local") {
              const list = localBoards();
              const index = list.findIndex((item) => item.id === currentBoardId);
              const meta = { id: currentBoardId, title: model.title || "未命名画布", updatedAt: model.boardUpdatedAt || nowIso(), nodes: model.nodes.length };
              if (index >= 0) list[index] = meta;
              else list.unshift(meta);
              saveLocalBoards(list);
              boards = list;
            }
            setSaveState("已保存 · " + nowLabel(), false);
          } catch {
            setSaveState("保存失败", true);
            toast("本地存储满了：先导出 JSON，再删一点大附件", true);
          }
        }
        function markDirty() {
          changeSeq += 1;
          setSaveState("保存中…", true);
          clearTimeout(saveTimer);
          saveTimer = setTimeout(persistNow, 260);
          schedulePush();
        }
        function setSaveState(text, dirty) {
          const el = $("#saveState");
          el.textContent = text;
          el.classList.toggle("dirty", Boolean(dirty));
        }

        // ---------- IndexedDB 附件 ----------
        function openDb() {
          if (dbPromise) return dbPromise;
          dbPromise = new Promise((resolve, reject) => {
            try {
              const req = indexedDB.open(DB_NAME, 1);
              req.onupgradeneeded = () => {
                const db = req.result;
                if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE, { keyPath: "id" });
              };
              req.onsuccess = () => resolve(req.result);
              req.onerror = () => reject(req.error);
            } catch (err) {
              reject(err);
            }
          });
          return dbPromise;
        }
        async function putFile(record) {
          try {
            const db = await openDb();
            await new Promise((resolve, reject) => {
              const tx = db.transaction(DB_STORE, "readwrite");
              tx.objectStore(DB_STORE).put(record);
              tx.oncomplete = resolve;
              tx.onerror = () => reject(tx.error);
            });
          } catch {
            memFiles.set(record.id, record);
          }
        }
        async function getFile(id) {
          if (memFiles.has(id)) return memFiles.get(id);
          try {
            const db = await openDb();
            return await new Promise((resolve, reject) => {
              const tx = db.transaction(DB_STORE, "readonly");
              const req = tx.objectStore(DB_STORE).get(id);
              req.onsuccess = () => resolve(req.result || null);
              req.onerror = () => reject(req.error);
            });
          } catch {
            return memFiles.get(id) || null;
          }
        }
        async function deleteFile(id) {
          memFiles.delete(id);
          try {
            const db = await openDb();
            await new Promise((resolve) => {
              const tx = db.transaction(DB_STORE, "readwrite");
              tx.objectStore(DB_STORE).delete(id);
              tx.oncomplete = resolve;
              tx.onerror = resolve;
            });
          } catch {
            /* 内存里已删 */
          }
        }

        // ---------- 视图 ----------
        function applyView() {
          world.style.transform = "translate(" + view.x + "px, " + view.y + "px) scale(" + view.zoom + ")";
          stage.style.setProperty("--gs", 26 * view.zoom + "px");
          stage.style.setProperty("--gx", view.x + "px");
          stage.style.setProperty("--gy", view.y + "px");
          zoomLabel.textContent = Math.round(view.zoom * 100) + "%";
        }
        function screenToWorld(clientX, clientY) {
          const rect = stage.getBoundingClientRect();
          return { x: (clientX - rect.left - view.x) / view.zoom, y: (clientY - rect.top - view.y) / view.zoom };
        }
        function zoomAt(clientX, clientY, factor) {
          const rect = stage.getBoundingClientRect();
          const sx = clientX - rect.left;
          const sy = clientY - rect.top;
          const wx = (sx - view.x) / view.zoom;
          const wy = (sy - view.y) / view.zoom;
          const next = Math.min(2.2, Math.max(0.3, view.zoom * factor));
          view.zoom = next;
          view.x = sx - wx * next;
          view.y = sy - wy * next;
          applyView();
          markDirty();
        }
        function fitView(animate) {
          if (!model.nodes.length) {
            view = { x: 60, y: 120, zoom: 1 };
            applyView();
            return;
          }
          let minX = Infinity;
          let minY = Infinity;
          let maxX = -Infinity;
          let maxY = -Infinity;
          for (const node of model.nodes) {
            const el = nodeEls.get(node.id);
            minX = Math.min(minX, node.x);
            minY = Math.min(minY, node.y);
            maxX = Math.max(maxX, node.x + NODE_W);
            maxY = Math.max(maxY, node.y + (el ? el.offsetHeight : 160));
          }
          const rect = stage.getBoundingClientRect();
          const pad = 70;
          const zoom = Math.min(1.15, Math.max(0.3, Math.min((rect.width - pad * 2) / (maxX - minX), (rect.height - pad * 2) / (maxY - minY))));
          view = { x: rect.width / 2 - ((minX + maxX) / 2) * zoom, y: rect.height / 2 - ((minY + maxY) / 2) * zoom, zoom };
          if (animate) {
            world.style.transition = "transform 260ms cubic-bezier(0.22,0.61,0.36,1)";
            setTimeout(() => { world.style.transition = ""; }, 300);
          }
          applyView();
          markDirty();
        }

        // ---------- 渲染 ----------
        function findNode(id) {
          return model.nodes.find((n) => n.id === id) || null;
        }
        function stickerPos(sticker) {
          const node = sticker.nodeId ? findNode(sticker.nodeId) : null;
          return node ? { x: node.x + NODE_W - 26, y: node.y - 22 } : { x: sticker.x, y: sticker.y };
        }
        function bandHeight() {
          let bottom = 0;
          for (const node of model.nodes) {
            const el = nodeEls.get(node.id);
            bottom = Math.max(bottom, node.y + (el ? el.offsetHeight : 180));
          }
          for (const sticker of model.stickers) {
            const pos = stickerPos(sticker);
            bottom = Math.max(bottom, pos.y + 34);
          }
          return Math.max(780, bottom + 90);
        }
        function renderBands() {
          bandsEl.textContent = "";

          el.querySelector(".color-btn").addEventListener("click", (event) => {

          el.querySelector(".date").addEventListener("change", (event) => {

          el.querySelector(".del").addEventListener("click", (event) => {

          el.querySelector(".add-file").addEventListener("click", (event) => {

          const picker = document.createElement("input");
          picker.type = "file";
          picker.multiple = true;

          el.append(picker);
          picker.addEventListener("change", async () => {
            const files = Array.from(picker.files || []);

          el.querySelector(".node-head").addEventListener("pointerdown", (event) => {

          });
          el.addEventListener("drop", async (event) => {
            if (!event.dataTransfer?.types?.includes("Files")) return;

            if (event.dataTransfer.files.length) await addFiles(node.id, event.dataTransfer.files);

          el.addEventListener("paste", (event) => {
            if (!event.target.isContentEditable) return;
            const text = event.clipboardData?.getData("text/plain");

          el.addEventListener("input", (event) => {

        function renderFiles(el, node) {
          const box = el.querySelector(".files");
          box.textContent = "";
          for (const file of node.files) {

            chip.querySelector(".file-x").addEventListener("click", async (event) => {
              event.stopPropagation();
              const index = node.files.findIndex((f) => f.id === file.id);
              if (index < 0) return;
              const [removed] = node.files.splice(index, 1);
              touch(node);
              renderFiles(el, node);
              markDirty();
              await deleteFile(removed.id);
              toast("已移除「" + removed.name + "」");
            });
            chip.addEventListener("click", () => openFile(file));

        // ---------- 选择 / 删除 ----------
        function selectNode(id) {
          selectedNode = id;
          selectedNodes = new Set(id ? [id] : []);
          selectedStickers.clear();
          selectedEdge = null;
          for (const [nodeId, el] of nodeEls) el.classList.toggle("selected", nodeId === id);
          for (const el of stickerEls.values()) el.classList.remove("selected");
          for (const path of pathEls.values()) path.classList.remove("selected");
        }
        function clearSelection() {
          selectedNode = null;
          selectedNodes.clear();
          selectedStickers.clear();
          selectedEdge = null;
          for (const el of nodeEls.values()) el.classList.remove("selected");
          for (const el of stickerEls.values()) el.classList.remove("selected");
          for (const path of pathEls.values()) path.classList.remove("selected");
        }
        function updateRubberSelection(rect) {
          selectedNodes = new Set();
          selectedStickers = new Set();
          for (const [id, el] of nodeEls) {
            const r = el.getBoundingClientRect();
            const hit = !(r.right < rect.left || r.left > rect.right || r.bottom < rect.top || r.top > rect.bottom);
            if (hit) selectedNodes.add(id);
            el.classList.toggle("selected", hit);
          }
          for (const [id, el] of stickerEls) {
            const r = el.getBoundingClientRect();
            const hit = !(r.right < rect.left || r.left > rect.right || r.bottom < rect.top || r.top > rect.bottom);
            if (hit) selectedStickers.add(id);
            el.classList.toggle("selected", hit);
          }
          selectedNode = selectedNodes.size === 1 ? [...selectedNodes][0] : null;
          selectedEdge = null;
          for (const path of pathEls.values()) path.classList.remove("selected");
        }
        function bulkDelete() {
          const ids = [...selectedNodes];
          const stickerIds = [...selectedStickers];
          if (!ids.length && !stickerIds.length) return;
          const at = nowIso();
          const removedNodes = model.nodes.filter((node) => ids.includes(node.id));
          const relatedEdges = model.edges.filter((edge) => ids.includes(edge.from) || ids.includes(edge.to));
          const relatedStickers = model.stickers.filter(
            (sticker) => stickerIds.includes(sticker.id) || (sticker.nodeId && ids.includes(sticker.nodeId)),
          );
          const places = removedNodes.map((node) => ({ node, index: model.nodes.findIndex((item) => item.id === node.id) }));
          model.nodes = model.nodes.filter((node) => !ids.includes(node.id));
          for (const id of ids) model.deleted.nodes[id] = at;
          model.edges = model.edges.filter((edge) => !relatedEdges.includes(edge));
          for (const edge of relatedEdges) model.deleted.edges[edge.id] = at;
          model.stickers = model.stickers.filter((sticker) => !relatedStickers.includes(sticker));
          for (const sticker of relatedStickers) model.deleted.stickers[sticker.id] = at;
          clearSelection();
          markDirty();
          renderNodes();
          renderBands();
          renderEdges();
          renderStickers();
          const total = ids.length + relatedStickers.length;
          showToast("已删除 " + total + " 项", {
            actionLabel: "撤销",
            onAction: () => {
              const now = nowIso();
              for (const item of places) {
                item.node.updatedAt = now;
                model.nodes.splice(Math.min(item.index, model.nodes.length), 0, item.node);
                delete model.deleted.nodes[item.node.id];
              }
              for (const edge of relatedEdges) {
                edge.updatedAt = now;
                model.edges.push(edge);
                delete model.deleted.edges[edge.id];
              }
              for (const sticker of relatedStickers) {
                sticker.updatedAt = now;
                model.stickers.push(sticker);
                delete model.deleted.stickers[sticker.id];
              }
              markDirty();
              renderNodes();
              renderBands();
              renderEdges();
              renderStickers();
            },
          });
        }
        function deleteNode(id) {
          const index = model.nodes.findIndex((n) => n.id === id);
          if (index < 0) return;
          const removed = model.nodes[index];
          const relatedEdges = model.edges.filter((e) => e.from === id || e.to === id);
          const relatedStickers = model.stickers.filter((s) => s.nodeId === id);
          const at = nowIso();
          model.nodes.splice(index, 1);
          model.deleted.nodes[id] = at;
          model.edges = model.edges.filter((e) => {
            if (e.from !== id && e.to !== id) return true;
            model.deleted.edges[e.id] = at;
            return false;
          });
          for (const sticker of relatedStickers) {
            sticker.nodeId = null;
            sticker.x = removed.x + NODE_W - 26;
            sticker.y = removed.y - 22;
            sticker.updatedAt = at;
          }
          markDirty();
          renderNodes();
          renderBands();
          renderEdges();
          renderStickers();
          if (selectedNode === id) selectedNode = null;
          showToast("已删除「" + (removed.title || "未命名") + "」", {
            actionLabel: "撤销",
            onAction: () => {
              removed.updatedAt = nowIso();
              model.nodes.splice(Math.min(index, model.nodes.length), 0, removed);
              delete model.deleted.nodes[id];
              model.edges.push(...relatedEdges);
              for (const edge of relatedEdges) delete model.deleted.edges[edge.id];
              for (const sticker of relatedStickers) sticker.nodeId = id;
              markDirty();
              renderNodes();
              renderBands();
              renderEdges();
              renderStickers();
            },
          });
        }

        // ---------- 拖节点 ----------
        function startNodeDrag(node, el, event) {
          if (event.button !== 0) return;
          event.preventDefault();
          selectNode(node.id);
          drag = { mode: "node", node, el, start: screenToWorld(event.clientX, event.clientY), origin: { x: node.x, y: node.y }, moved: false };
          el.classList.add("dragging");
        }
        function nearestSnap(value, candidates, threshold = 12) {
          let best = null;
          for (const candidate of candidates) {
            const dist = Math.abs(value - candidate);
            if (dist <= threshold && (!best || dist < best.dist)) best = { value: candidate, dist };
          }
          return best;
        }
        function showGuides(v, h) {
          const guides = $("#guides");
          const vEl = guides.querySelector(".v");
          const hEl = guides.querySelector(".h");
          guides.classList.toggle("on", v != null || h != null);
          vEl.style.left = (v ?? 0) + "px";
          vEl.style.display = v != null ? "" : "none";
          hEl.style.top = (h ?? 0) + "px";
          hEl.style.display = h != null ? "" : "none";
        }
        function hideGuides() {
          $("#guides").classList.remove("on");
        }

        // ---------- 连线 ----------
        function nodeHeight(node) {
          const el = nodeEls.get(node.id);
          return el ? el.offsetHeight : 160;
        }
        function edgeGeometry(edge) {
          const from = findNode(edge.from);
          const to = findNode(edge.to);
          if (!from || !to) return null;
          const a = { w: NODE_W, h: nodeHeight(from) };
          const b = { w: NODE_W, h: nodeHeight(to) };
          const ac = { x: from.x + a.w / 2, y: from.y + a.h / 2 };
          const bc = { x: to.x + b.w / 2, y: to.y + b.h / 2 };
          const dx = bc.x - ac.x;
          const dy = bc.y - ac.y;
          let p1;
          let p2;
          if (Math.abs(dx) >= Math.abs(dy)) {
            if (dx >= 0) {
              p1 = { x: from.x + a.w, y: ac.y };
              p2 = { x: to.x, y: bc.y };
            } else {
              p1 = { x: from.x, y: ac.y };
              p2 = { x: to.x + b.w, y: bc.y };
            }
          } else if (dy >= 0) {
            p1 = { x: ac.x, y: from.y + a.h };
            p2 = { x: bc.x, y: to.y };
          } else {
            p1 = { x: ac.x, y: from.y };
            p2 = { x: bc.x, y: to.y + b.h };
          }
          const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
          const k = Math.min(150, Math.max(40, dist * 0.4));
          let c1;
          let c2;
          if (Math.abs(dx) >= Math.abs(dy)) {
            const sign = Math.sign(p2.x - p1.x) || 1;
            c1 = { x: p1.x + sign * k, y: p1.y };
            c2 = { x: p2.x - sign * k, y: p2.y };
          } else {
            const sign = Math.sign(p2.y - p1.y) || 1;
            c1 = { x: p1.x, y: p1.y + sign * k };
            c2 = { x: p2.x, y: p2.y - sign * k };
          }
          const d = "M " + p1.x + " " + p1.y + " C " + c1.x + " " + c1.y + ", " + c2.x + " " + c2.y + ", " + p2.x + " " + p2.y;
          return {
            d,
            mid: {
              x: 0.125 * p1.x + 0.375 * c1.x + 0.375 * c2.x + 0.125 * p2.x,
              y: 0.125 * p1.y + 0.375 * c1.y + 0.375 * c2.y + 0.125 * p2.y,
            },
          };
        }
        function renderEdges() {
          const ids = new Set(model.edges.map((e) => e.id));
          for (const [id, path] of [...pathEls]) {
            if (ids.has(id)) continue;
            path.remove();
            pathEls.delete(id);
            labelEls.get(id)?.remove();
            labelEls.delete(id);
            if (selectedEdge === id) selectedEdge = null;
          }
          for (const edge of model.edges) {
            let path = pathEls.get(edge.id);
            if (!path) {
              path = document.createElementNS("http://www.w3.org/2000/svg", "path");
              path.dataset.edge = edge.id;
              path.addEventListener("click", (event) => {
                event.stopPropagation();
                clearSelection();
                selectedEdge = edge.id;
                path.classList.add("selected");
              });
              edgePaths.append(path);
              pathEls.set(edge.id, path);
            }
            const geom = edgeGeometry(edge);
            if (!geom) continue;
            path.setAttribute("d", geom.d);
            path.classList.toggle("selected", selectedEdge === edge.id);

            let label = labelEls.get(edge.id);
            if (!label) {
              label = document.createElement("div");
              label.className = "edge-label";
              label.dataset.edge = edge.id;
              label.addEventListener("click", (event) => {
                event.stopPropagation();
                editEdgeLabel(edge.id);
              });
              labelEls.set(edge.id, label);
              labelsEl.append(label);
            }
            label.textContent = edge.label || "＋ 说明";
            label.classList.toggle("empty", !edge.label);
            label.style.left = geom.mid.x + "px";
            label.style.top = geom.mid.y + "px";
          }

        function scheduleEdges() {
          if (edgeFrame) return;

            edgeFrame = 0;

        function editEdgeLabel(edgeId) {
          const edge = model.edges.find((e) => e.id === edgeId);
          if (!edge) return;
          labelEls.get(edgeId)?.remove();
          labelEls.delete(edgeId);
          const geom = edgeGeometry(edge);
          if (!geom) return;
          const input = document.createElement("input");
          input.className = "edge-label-input";
          input.value = edge.label || "";
          input.placeholder = "这条线说明什么？回车保存";
          input.style.left = geom.mid.x + "px";
          input.style.top = geom.mid.y + "px";
          labelsEl.append(input);
          input.focus();
          input.select();
          let done = false;
          const finish = (save) => {
            if (done) return;
            done = true;
            const value = input.value.trim();
            input.remove();
            if (save && value !== edge.label) {
              edge.label = value;
              touch(edge);
              markDirty();
            }
            renderEdges();
          };
          input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              finish(true);
            } else if (event.key === "Escape") {
              finish(false);
            }
          });
          input.addEventListener("blur", () => finish(true));
          input.addEventListener("pointerdown", (event) => event.stopPropagation());
        }
        function startConnect(node, event) {
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("class", "edge-temp");
          edgePaths.append(path);
          drag = { mode: "connect", from: node.id, start: { x: node.x + NODE_W, y: node.y + 53.5 }, path };
          updateTemp(event.clientX, event.clientY);
        }
        function updateTemp(clientX, clientY) {
          if (!drag || drag.mode !== "connect") return;
          const p2 = screenToWorld(clientX, clientY);
          const p1 = drag.start;
          const k = Math.max(40, Math.min(140, Math.abs(p2.x - p1.x) * 0.4));
          drag.path.setAttribute("d", "M " + p1.x + " " + p1.y + " C " + (p1.x + k) + " " + p1.y + ", " + (p2.x - k) + " " + p2.y + ", " + p2.x + " " + p2.y);
        }
        function finishConnect(clientX, clientY) {
          if (!drag || drag.mode !== "connect") return;
          const path = drag.path;
          const from = drag.from;
          drag = null;
          path.remove();
          const targetEl = document.elementFromPoint(clientX, clientY)?.closest?.(".node");
          const targetId = targetEl?.dataset.id;
          if (!targetId || targetId === from) return;
          if (model.edges.some((e) => e.from === from && e.to === targetId)) {
            toast("这两块已经连过了");
            return;
          }
          const edge = { id: uid(), from, to: targetId, label: "", updatedAt: nowIso() };
          model.edges.push(edge);
          markDirty();
          renderEdges();
          editEdgeLabel(edge.id);
        }

        // ---------- 整理 / 对齐 ----------
        function applyPositionsAnimated() {
          for (const [id, el] of nodeEls) {
            const node = findNode(id);
            if (!node) continue;
            el.style.transition = "left 280ms ease, top 280ms ease";
            el.style.left = node.x + "px";
            el.style.top = node.y + "px";
            setTimeout(() => { el.style.transition = ""; }, 320);

          markDirty();

        function layoutColumns({ silent = false } = {}) {
          if (!model.nodes.length) {
            if (!silent) toast("先加几块再整理");
            return;
          }          const { cols, days } = getColumns();
          const start = defaultStart();
          const counters = {};
          let undated = 0;
          for (const node of model.nodes) {
            const date = parseDate(node.date);
            if (!date) {
              node.x = columnX(cols.length);
              node.y = TOP + undated * ROW_H;
              undated += 1;
              continue;
            }
            const index = Math.floor((date - start) / 86400000 / days);
            const col = Math.max(0, Math.min(cols.length - 1, index));
            counters[col] = counters[col] || 0;
            node.x = columnX(col);
            node.y = TOP + counters[col] * ROW_H;
            counters[col] += 1;
          }
          applyPositionsAnimated();
          renderBands();
          setTimeout(renderEdges, 320);
          if (!silent) toast("已按日期摆进列里，位置还能自己拖");
        }
        function setArrangeActive(on) {
          const button = $("#btnLayout");

        }
        function toggleArrange() {
          if (!model.nodes.length) {
            toast("先加几块再排列");
            return;

          if (arrangeSnapshot) {
            for (const node of model.nodes) {
              const pos = arrangeSnapshot.get(node.id);
              if (pos) {
                node.x = pos.x;
                node.y = pos.y;
              }
            }
            arrangeSnapshot = null;
            setArrangeActive(false);
            applyPositionsAnimated();
            renderBands();
            setTimeout(renderEdges, 320);
            toast("已恢复排列前的位置");
            return;
          }
          arrangeSnapshot = new Map(model.nodes.map((n) => [n.id, { x: n.x, y: n.y }]));
          layoutColumns({ silent: true });
          setArrangeActive(true);
          toast("已按时间排列，再点一下可恢复");

        function alignAll() {
          const base = columnXs();
          const xs = [...base, columnX(base.length)];
          const groups = new Map();
          for (const node of model.nodes) {
            let best = 0;
            let bestDist = Infinity;
            xs.forEach((x, index) => {
              const dist = Math.abs(node.x - x);
              if (dist < bestDist) {
                bestDist = dist;
                best = index;
              }
            });
            if (!groups.has(best)) groups.set(best, []);
            groups.get(best).push(node);
          }
          for (const [index, list] of groups) {
            list.sort((a, b) => a.y - b.y);
            let y = TOP;
            for (const node of list) {
              node.x = xs[index];
              node.y = y;
              const el = nodeEls.get(node.id);
              y += (el ? el.offsetHeight : 180) + 24;
            }
          }
          applyPositionsAnimated();
          renderBands();
          setTimeout(renderEdges, 320);
          toast("已按列从上往下对齐");

          for (const file of Array.from(fileList)) {
            if (file.size > 25 * 1024 * 1024) {
              toast("「" + file.name + "」超过 25MB，demo 先不收", true);
              continue;
            }
            if (mode === "server") {
              try {
                const res = await fetch(
                  "/api/upload?name=" + encodeURIComponent(file.name) + "&nodeId=" + encodeURIComponent(nodeId),
                  { method: "POST", headers: { "content-type": file.type || "application/octet-stream" }, body: file },
                );
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.ok) throw new Error(data.error || "上传失败");
                const uploaded = data.file;
                const target = findNode(nodeId);
                if (!target) continue;
                target.files.push({ id: uploaded.id, sha: uploaded.sha, url: uploaded.url, name: uploaded.name, type: uploaded.type, size: uploaded.size });
                touch(target);
                count += 1;
              } catch (err) {
                toast("「" + file.name + "」上传失败：" + err.message, true);
              }
              continue;
            }
            const record = { id: uid(), name: file.name, type: file.type || "", size: file.size, blob: file };
            await putFile(record);
            const target = findNode(nodeId);
            if (!target) continue;
            target.files.push({ id: record.id, name: record.name, type: record.type, size: record.size });
            touch(target);
            count += 1;
          }
          if (count) {
            markDirty();
            const el = nodeEls.get(nodeId);
            const target = findNode(nodeId);
            if (el && target) {
              renderFiles(el, target);
              scheduleEdges();
            }
            toast("已挂上 " + count + " 个文件");
          }
        }

        // ---------- 导出 / 导入 ----------
        function download(text, filename, mime) {
          const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.append(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
        }
        function blobToDataUrl(blob) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error);
            reader.readAsDataURL(blob);
          });
        }
        function downloadBlob(blob, filename) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.append(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
        }
        async function exportJson() {
          if (mode === "server") {
            try {
              const res = await fetch("/api/export?board=" + encodeURIComponent(currentBoardId));
              if (!res.ok) throw new Error("导出失败");
              const blob = await res.blob();
              downloadBlob(blob, (model.title || "实验画布") + ".json");
              toast("已导出共享数据（含附件），可以直接发给别人导入");
            } catch (err) {
              toast(err.message || "导出失败", true);
            }
            return;
          }
          const files = [];
          for (const node of model.nodes) {
            for (const file of node.files) {
              const record = await getFile(file.id);
              if (!record || !record.blob) continue;
              files.push({ id: file.id, name: record.name, type: record.type, size: record.size, dataUrl: await blobToDataUrl(record.blob) });
            }
          }
          download(
            JSON.stringify({ app: "labflow", v: 4, exportedAt: new Date().toISOString(), board: model, files }, null, 2),
            (model.title || "实验画布") + ".json",
            "application/json",
          );
          toast("已导出 JSON（含 " + files.length + " 个附件）");
        }
        function toMarkdown() {
          const lines = ["# " + (model.title || "实验画布"), ""];
          const sorted = [...model.nodes].sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999"));
          for (const node of sorted) {
            lines.push("---", "");
            lines.push("## " + (node.title || "未命名"));
            const meta = [];
            if (node.date) meta.push(node.date);
            meta.push(node.owner || "我");
            lines.push("", "*" + meta.join(" · ") + "*", "");
            if (node.body) lines.push(node.body, "");
            if (node.result) lines.push("**结论**：" + node.result, "");
            if (node.files.length) lines.push("附件：" + node.files.map((f) => f.name).join("、"), "");
          }
          if (model.edges.length) {
            lines.push("---", "", "## 连线", "");
            for (const edge of model.edges) {
              const from = findNode(edge.from)?.title || "?";
              const to = findNode(edge.to)?.title || "?";
              lines.push("- " + from + " → " + to + (edge.label ? "（" + edge.label + "）" : ""));
            }
          }
          return lines.join("\n") + "\n";
        }
        async function importJson(file) {
          const text = await file.text();
          let data;
          try {
            data = JSON.parse(text);
          } catch {
            throw new Error("不是合法的 JSON");
          }
          const incoming = data.board ?? data.model ?? data;
          if (!incoming || !Array.isArray(incoming.nodes)) throw new Error("这不像导出的实验画布");
          if (mode === "server") {
            const res = await fetch("/api/import", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ boardId: currentBoardId, bundle: { board: incoming, files: Array.isArray(data.files) ? data.files : [] } }),
            });
            const out = await res.json().catch(() => ({}));
            if (!res.ok || !out.ok) throw new Error(out.error || "导入失败");
            await refreshFromServer();
            renderAll();
            fitView(true);
            toast("导入完成，已和现在的内容合并");
            return;
          }
          for (const item of Array.isArray(data.files) ? data.files : []) {
            try {
              const response = await fetch(item.dataUrl);
              const blob = await response.blob();
              await putFile({ id: item.id, name: item.name, type: item.type, size: item.size, blob });
            } catch {
              /* 少一个附件不阻断 */
            }
          }
          model = mergeBoard(model, incoming);
          model.boardUpdatedAt = nowIso();
          renderAll();
          fitView(true);
          persistNow();
          toast("导入完成：" + model.nodes.length + " 块");
        }

        async function refreshFromServer() {
          if (mode !== "server") return;
          const boardAtStart = currentBoardId;
          try {
            const res = await fetch("/api/board?board=" + encodeURIComponent(boardAtStart), { cache: "no-store" });
            if (!res.ok) throw new Error("bad");
            const data = await res.json();
            if (boardAtStart !== currentBoardId) return;
            serverRev = data.rev;
            model = mergeBoard(model, data.board);
            scheduleRefresh();
            if (changeSeq > pushedSeq) schedulePush();
          } catch {
            setConn("断线了，改动暂存本地", false);
