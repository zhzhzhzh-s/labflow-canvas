        function connectSSE() {
          if (sse) sse.close();
          const url = "/api/events?client=" + encodeURIComponent(CLIENT_ID)
            + "&name=" + encodeURIComponent(ME.name)
            + "&color=" + encodeURIComponent(ME.color)
            + "&board=" + encodeURIComponent(currentBoardId);
          sse = new EventSource(url);
          sse.addEventListener("hello", (event) => {
            const data = JSON.parse(event.data);
            onlinePeople = data.presence || [];
            renderPresence();
            setConn("已连接 · " + onlinePeople.length + " 人", true);
          });
          sse.addEventListener("presence", (event) => {
            onlinePeople = JSON.parse(event.data);
            renderPresence();
            setConn("已连接 · " + onlinePeople.length + " 人", true);
          });
          sse.addEventListener("state", () => refreshFromServer());
          sse.onopen = () => {
            setConn("已连接 · " + (onlinePeople.length || 1) + " 人", true);
            refreshFromServer();
            if (changeSeq > pushedSeq) schedulePush();
          };
          sse.onerror = () => setConn("重连中…", false);
        }
        function schedulePush() {
          if (mode !== "server") return;
          clearTimeout(pushTimer);
          pushTimer = setTimeout(pushNow, 380);
        }
        async function pushNow() {
          if (mode !== "server" || pushing) return;
          if (changeSeq <= pushedSeq) return;
          const seqAtStart = changeSeq;
          const boardAtStart = currentBoardId;
          pushing = true;
          clearTimeout(retryTimer);
          try {
            const res = await fetch("/api/board", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ boardId: boardAtStart, board: model, clientId: CLIENT_ID }),
            });
            if (!res.ok) throw new Error("bad");
            const data = await res.json();
            if (boardAtStart !== currentBoardId) return;
            serverRev = data.rev;
            pushedSeq = Math.max(pushedSeq, seqAtStart);
            if (data.board) {
              model = mergeBoard(model, data.board);
              persistNow();
              scheduleRefresh();
            }
            setConn("已同步 · " + (onlinePeople.length || 1) + " 人", true);
            if (changeSeq > pushedSeq) schedulePush();
          } catch {
            setConn("连不上，改动暂存本地", false);
            clearTimeout(retryTimer);
            retryTimer = setTimeout(() => {
              if (changeSeq > pushedSeq) pushNow();
            }, 4000);
          } finally {
            pushing = false;
          }
        }
        async function flushCurrent() {
          if (mode !== "server" || changeSeq <= pushedSeq) return;
          const deadline = Date.now() + 2500;
          while (pushing && Date.now() < deadline) {
            await new Promise((resolve) => setTimeout(resolve, 60));
          }
          if (changeSeq > pushedSeq) await pushNow();
        }
        function flushOnUnload() {
          if (mode !== "server" || changeSeq <= pushedSeq) return;
          try {
            const body = JSON.stringify({ boardId: currentBoardId, board: model, clientId: CLIENT_ID });
            navigator.sendBeacon("/api/board", new Blob([body], { type: "application/json" }));
          } catch {
            /* 尽力而为 */
          }
        }

        function bindStage() {
          stage.addEventListener("pointerdown", (event) => {
            if (event.target.closest(".node, .zoombar, .hint, .empty-card")) return;
            if (event.button === 1 || (event.button === 0 && !spaceDown)) {
              clearSelection();
              drag = { mode: "pan", startX: event.clientX, startY: event.clientY, viewX: view.x, viewY: view.y };
              stage.classList.add("panning");
              event.preventDefault();
              return;
            }
            if (event.button !== 0) return;
            clearSelection();
            const rubber = $("#rubber");
            const rect = stage.getBoundingClientRect();
            rubber.hidden = false;
            rubber.style.left = event.clientX - rect.left + "px";
            rubber.style.top = event.clientY - rect.top + "px";
            rubber.style.width = "0px";
            rubber.style.height = "0px";
            drag = { mode: "rubber", startX: event.clientX, startY: event.clientY, stageRect: rect, moved: false };
            event.preventDefault();
          });
          stage.addEventListener("wheel", (event) => {
            event.preventDefault();
            const factor = Math.exp(-event.deltaY * 0.0015);
            zoomAt(event.clientX, event.clientY, Math.min(2, Math.max(0.5, factor)));
          }, { passive: false });
          stage.addEventListener("dblclick", (event) => {
            if (event.target.closest(".node, .zoombar, .hint, .empty-card")) return;
            addNode("experiment", screenToWorld(event.clientX, event.clientY));
          });

          window.addEventListener("pointermove", (event) => {
            if (!drag) return;
            if (drag.mode === "rubber") {
              const left = Math.min(drag.startX, event.clientX);
              const top = Math.min(drag.startY, event.clientY);
              const right = Math.max(drag.startX, event.clientX);
              const bottom = Math.max(drag.startY, event.clientY);
              if (right - left > 3 || bottom - top > 3) drag.moved = true;
              const rubber = $("#rubber");
              rubber.style.left = left - drag.stageRect.left + "px";
              rubber.style.top = top - drag.stageRect.top + "px";
              rubber.style.width = right - left + "px";
              rubber.style.height = bottom - top + "px";
              updateRubberSelection({ left, top, right, bottom });
              return;
            }
            if (drag.mode === "pan") {
              view.x = drag.viewX + (event.clientX - drag.startX);
              view.y = drag.viewY + (event.clientY - drag.startY);
              applyView();
              return;
            }
            if (drag.mode === "node") {
              const point = screenToWorld(event.clientX, event.clientY);
              const dx = point.x - drag.start.x;
              const dy = point.y - drag.start.y;
              if (Math.abs(dx) + Math.abs(dy) > 1) drag.moved = true;
              const rawX = drag.origin.x + dx;
              const rawY = drag.origin.y + dy;
              const others = model.nodes.filter((n) => n.id !== drag.node.id);
              const snapX = nearestSnap(rawX, [...columnXs(), ...others.map((n) => n.x)]);
              const snapY = nearestSnap(rawY, [...Array.from({ length: 40 }, (_, k) => TOP + k * ROW_H), ...others.map((n) => n.y)]);
              drag.node.x = Math.round(snapX ? snapX.value : rawX);
              drag.node.y = Math.round(snapY ? snapY.value : rawY);
              drag.el.style.left = drag.node.x + "px";
              drag.el.style.top = drag.node.y + "px";
              showGuides(snapX?.value ?? null, snapY?.value ?? null);
              scheduleEdges();
              return;
            }
            if (drag.mode === "sticker") {
              const point = screenToWorld(event.clientX, event.clientY);
              const dx = point.x - drag.start.x;
              const dy = point.y - drag.start.y;
              if (Math.abs(dx) + Math.abs(dy) > 1) drag.moved = true;
              if (drag.sticker.nodeId) {
                drag.sticker.nodeId = null;
                drag.sticker.x = drag.origin.x;
                drag.sticker.y = drag.origin.y;
              }
              drag.sticker.x = Math.round(drag.origin.x + dx);
              drag.sticker.y = Math.round(drag.origin.y + dy);
              drag.el.style.left = drag.sticker.x + "px";
              drag.el.style.top = drag.sticker.y + "px";
              const over = document.elementFromPoint(event.clientX, event.clientY)?.closest?.(".node");
              for (const [id, el] of nodeEls) el.classList.toggle("drag-over", Boolean(over) && over.dataset.id === id);
              return;
            }
            if (drag.mode === "connect") updateTemp(event.clientX, event.clientY);
          });

          window.addEventListener("pointerup", (event) => {
            if (!drag) return;
            const mode = drag.mode;
            if (mode === "rubber") {
              $("#rubber").hidden = true;
              if (!drag.moved) clearSelection();
            } else if (mode === "pan") {
              stage.classList.remove("panning");
              markDirty();
            } else if (mode === "node") {
              drag.el.classList.remove("dragging");
              hideGuides();
              if (drag.moved) {
                touch(drag.node);
                markDirty();
              }
            } else if (mode === "sticker") {
              drag.el.classList.remove("dragging");
              for (const el of nodeEls.values()) el.classList.remove("drag-over");
              if (drag.moved) {
                const over = document.elementFromPoint(event.clientX, event.clientY)?.closest?.(".node");
                drag.sticker.nodeId = over ? over.dataset.id : null;
                touch(drag.sticker);
                markDirty();
                renderStickers();
                renderBands();
              } else {
                openStickerEditor(drag.sticker, drag.el);
              }
            } else if (mode === "connect") {
              finishConnect(event.clientX, event.clientY);
              return;
            }
            drag = null;
          });

          document.addEventListener("keydown", (event) => {
            if (event.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) return;
            if (event.code === "Space" && !event.ctrlKey && !event.metaKey) {
              spaceDown = true;
              stage.classList.add("selecting");
              event.preventDefault();
              return;
            }
            if (event.key === "Delete" || event.key === "Backspace") {
              if (selectedEdge) {
                event.preventDefault();
                const id = selectedEdge;
                const index = model.edges.findIndex((e) => e.id === id);
                if (index >= 0) {
                  const [removedEdge] = model.edges.splice(index, 1);
                  model.deleted.edges[id] = nowIso();
                  showToast("已删除这条线", {
                    actionLabel: "撤销",
                    onAction: () => {
                      removedEdge.updatedAt = nowIso();
                      model.edges.splice(index, 0, removedEdge);
                      delete model.deleted.edges[id];
                      markDirty();
                      renderEdges();
                    },
                  });
                }
                selectedEdge = null;
                markDirty();
                renderEdges();
              } else if (selectedNodes.size > 1 || selectedStickers.size > 0) {
                event.preventDefault();
                bulkDelete();
              } else if (selectedNode) {
                event.preventDefault();
                deleteNode(selectedNode);
              }
            } else if (event.key === "Escape") {
              clearSelection();
            } else if (event.key.toLowerCase() === "n" && !event.ctrlKey && !event.metaKey) {
              event.preventDefault();
              const rect = stage.getBoundingClientRect();
              addNode("experiment", screenToWorld(rect.left + rect.width / 2, rect.top + rect.height / 2));
            }
          });
          document.addEventListener("keyup", (event) => {
            if (event.code === "Space") {
              spaceDown = false;
              stage.classList.remove("selecting");
            }
          });
          window.addEventListener("blur", () => {
            spaceDown = false;
            stage.classList.remove("selecting");
          });

          $("#zoomIn").addEventListener("click", () => {
            const rect = stage.getBoundingClientRect();
            zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1.2);
          });
          $("#zoomOut").addEventListener("click", () => {
            const rect = stage.getBoundingClientRect();
            zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1 / 1.2);
          });
          $("#zoomFit").addEventListener("click", () => fitView(true));
        }

        function bindPalette() {
          const begin = (event, payload, ghostHtml) => {
            event.preventDefault();

            const inside = event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
            const center = screenToWorld(rect.left + rect.width / 2, rect.top + rect.height / 2);
            if (info.moved && inside) {

              if (info.mode === "sticker") addSticker(info.tone, point, nodeIdAt(event.clientX, event.clientY));
              else addNode("experiment", point);
            } else if (!info.moved) {
              if (info.mode === "sticker") addSticker(info.tone, center);
              else addNode("experiment", center);
            }
          });
        }

                body: "60℃ / 2h / pH 7.2 起算。\n四个平行样，产率 58%–64%。",
                result: "均值 63%，批内波动 6 个点，重复性不够。",
                files: [{ id: csvId, name: "第一批数据.csv", type: "text/csv", size: new Blob([csv]).size }],
              },
              {
                id: characterization.id,
                owner: "师兄",
                color: "#3f6fa8",
                kind: "experiment",
                date: "2026-10-03",
                title: "XRD：三个样晶型对比",
                body: "取 A/B/C 三个样做 XRD，2θ 10–80°。",
                result: "三组峰位一致，晶型没变，排除相变。",
                files: [],
              },
              {
                id: summary.id,
                owner: "我",
                color: "#c98a1b",
                kind: "summary",
                date: "2026-10-08",
                title: "阶段结论：问题在 pH 漂移，不在配方",
                body: "把第一批四个样重测 pH：终点 7.1–7.5 不等，和产率高低对得上。\nXRD 又排除了晶型变化。",
                result: "",
                files: [],
              },
              {
                id: second.id,
                owner: "师弟",
                color: "#4a8a52",
                kind: "experiment",
                date: "2026-10-10",
                title: "补做第 3 组 + 搅拌对照",
                body: "重跑 C 样；加 300 / 600 rpm 两组搅拌对照，其他条件不动。",
                result: "600 rpm 组 pH 稳定在 7.2±0.05，产率 66%。",
                files: [],
              },
            ],
            edges: [
              { id: uid(), from: first.id, to: summary.id, label: "数据够了，先总结" },
              { id: uid(), from: characterization.id, to: summary.id, label: "晶型没变" },
              { id: uid(), from: summary.id, to: second.id, label: "按结论补做" },
            ],
            view: null,
          });
          layoutColumns({ silent: true });
          model.boardUpdatedAt = nowIso();
          sampleSeeded = true;
          localStorage.setItem("labflow.seeded", "1");
          if (mode === "server") fetch("/api/seed", { method: "POST" }).catch(() => {});
          const meta = boards.find((item) => item.id === currentBoardId);
          if (meta) meta.title = model.title;
          renderAll();
          fitView(false);
          persistNow();
          updateBoardUI();
          renderBoardList();
          changeSeq += 1;
          schedulePush();
        }

        // ---------- 顶栏 ----------
        function bindTopbar() {
          const titleEl = $("#boardTitle");
          titleEl.addEventListener("input", () => {
            model.title = titleEl.textContent;
            model.boardUpdatedAt = nowIso();
            const meta = boards.find((item) => item.id === currentBoardId);
            if (meta) meta.title = model.title;
            updateBoardUI();
            renderBoardList();
            markDirty();
          });
          $("#btnLayout").addEventListener("click", toggleArrange);
          $("#btnAlign").addEventListener("click", alignAll);
          $("#btnEmptyNew").addEventListener("click", () => {
            const rect = stage.getBoundingClientRect();
            addNode("experiment", screenToWorld(rect.left + rect.width / 2, rect.top + rect.height / 2));
          });
          $("#btnEmptySample").addEventListener("click", () => loadSample());
          $("#btnImport").addEventListener("click", () => {
            $("#importFile").value = "";
            $("#importFile").click();
          });
          $("#importFile").addEventListener("change", async (event) => {
            const file = event.target.files?.[0];
            if (!file) return;
            try {
              await importJson(file);
            } catch (err) {
              toast("导入失败：" + err.message, true);
            }
          });
          $$("[data-export]").forEach((button) => {
            button.addEventListener("click", async () => {
              if (button.dataset.export === "md") {
                download(toMarkdown(), (model.title || "实验画布") + ".md", "text/markdown;charset=utf-8");
                toast("已导出 Markdown");
              } else {
                await exportJson();
              }
            });
          });
          $("#hintClose").addEventListener("click", () => {
            $("#hint").hidden = true;
            localStorage.setItem("labflow.canvas.hint", "1");
          });
          if (!localStorage.getItem("labflow.canvas.hint")) $("#hint").hidden = false;
        }

        // ---------- 启动 ----------
        async function boot() {
          await initBoards();
          model = emptyModel("实验画布");
          bindTopbar();
          bindStage();
          bindPalette();
          bindColorPop();
          bindColumns();
          bindIdentity();
          bindStickerPop();
          bindBoardUI();
          renderPresence();
          await loadBoard(currentBoardId);
          window.addEventListener("beforeunload", () => {
            if (saveTimer) {
              clearTimeout(saveTimer);
              persistNow();
            }
            flushOnUnload();
          });
        }

        boot().catch((err) => {
          console.error(err);
          document.body.insertAdjacentHTML(
            "beforeend",
            '<div style="position:fixed;left:20px;right:20px;bottom:20px;background:#8c3f22;color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;z-index:99">启动失败：' + escapeHtml(err.message) + "</div>",
          );
        });
      })();
    </script>
  </body>
</html>
